# Текстовите на страниците на Quire, на македонски. Сајтот ги менува во својот translations/ директориум.
"Sign in": "Најавете се"
"Sign out": "Одјавете се"
"Email or username": "Е-пошта или корисничко име"
"Password": "Лозинка"
"Keep me signed in on this device": "Запомни ме на овој уред"
"You're signed in as {name}.": "Најавени сте како {name}."
"Signing in with a password is turned off.": "Најавата со лозинка е исклучена."
"Preview: this isn't published, so only people who may see unpublished content see it.": "Преглед: ова не е објавено, па го гледаат само оние што смеат да гледаат необјавена содржина."
"Create an account": "Создајте сметка"
"Name": "Име"
"Email": "Е-пошта"
"At least 8 characters.": "Најмалку 8 знаци."
"Create account": "Создај сметка"
"Already have an account?": "Веќе имате сметка?"
"New here?": "Прв пат сте тука?"
"Forgot your password?": "Ја заборавивте лозинката?"
"Enter your email address, and we'll send you a link to choose a new password.": "Внесете ја Вашата адреса за е-пошта и ќе Ви испратиме линк за да изберете нова лозинка."
"Send the link": "Испрати го линкот"
"Back to signing in": "Назад кон најавата"
"Choose a new password": "Изберете нова лозинка"
"New password": "Нова лозинка"
"Change password": "Промени ја лозинката"
"Confirm your email address": "Потврдете ја адресата за е-пошта"
"Didn't get the email, or did the link expire? Enter your email address for a new one.": "Не ја добивте пораката или линкот истече? Внесете ја адресата за е-пошта за да добиете нов."
"Check your inbox": "Проверете го сандачето"
"If {email} has an account with us, we've sent it an email with a link. It can take a few minutes; check your spam folder too.": "Ако {email} има сметка кај нас, испративме порака со линк на неа. Може да потрае неколку минути; проверете ја и папката за спам."
"This link doesn't work anymore": "Овој линк веќе не работи"
"Links in our emails work once, for a limited time, and only the newest one does.": "Линковите во нашите пораки работат еднаш, ограничено време, и работи само најновиот."
"Get a new link": "Добијте нов линк"
"Send a new link": "Испрати нов линк"
"The form expired. Please try again.": "Формуларот истече. Обидете се повторно."
"Too many attempts. Please try again in a few minutes.": "Премногу обиди. Обидете се повторно за неколку минути."
"Enter your email address.": "Внесете ја адресата за е-пошта."
"Enter a valid email address.": "Внесете важечка адреса за е-пошта."
"Another user has this email.": "Друг корисник ја има оваа адреса за е-пошта."
"Passwords must be at least 8 characters long.": "Лозинката мора да има најмалку 8 знаци."
"The display name must be 1 to 100 characters long.": "Името за прикажување мора да има од 1 до 100 знаци."
"This link doesn't work anymore.": "Овој линк веќе не работи."
"Your email address is confirmed. You can sign in now.": "Адресата за е-пошта е потврдена. Сега можете да се најавите."
"Your password is changed. You can sign in with it now.": "Лозинката е променета. Сега можете да се најавите со неа."
"Reset your password": "Поставете нова лозинка"
"You already have an account": "Веќе имате сметка"
"Hello {name},": "Здраво, {name},"
"Someone asked to reset the password of your account. If it was you, choose a new password here:": "Некој побара нова лозинка за Вашата сметка. Ако сте биле Вие, изберете нова лозинка тука:"
"The link works once, for one hour. If you didn't ask for it, ignore this email: your password stays as it is.": "Линкот работи еднаш, еден час. Ако не сте го побарале, занемарете ја пораката: лозинката останува иста."
"Please confirm that this is your email address, so you can sign in:": "Потврдете дека ова е Вашата адреса за е-пошта, за да можете да се најавите:"
"Confirm my email address": "Потврди ја мојата адреса"
"The link works for two days. If you didn't create an account, ignore this email.": "Линкот работи два дена. Ако не сте создале сметка, занемарете ја пораката."
"Someone tried to create an account with your email address, but you already have one.": "Некој се обиде да создаде сметка со Вашата адреса за е-пошта, но Вие веќе имате сметка."
"If it wasn't you, ignore this email: nothing changed.": "Ако не сте биле Вие, занемарете ја пораката: ништо не е променето."
"You're invited to {site}": "Поканети сте на {site}"
"Choose your password": "Изберете лозинка"
"Save password": "Зачувај ја лозинката"
"Welcome to {site}, {name}. Choose the password you'll sign in with as {username}.": "Добредојдовте на {site}, {name}. Изберете ја лозинката со која ќе се најавувате како {username}."
"Ask the person who invited you to send a new invitation.": "Замолете го лицето што Ве покани да испрати нова покана."
"{admin} added you to {site}, as {username}. Choose your password to sign in:": "{admin} Ве додаде на {site} како {username}. Изберете лозинка за да се најавите:"
"You were added to {site}, as {username}. Choose your password to sign in:": "Додадени сте на {site} како {username}. Изберете лозинка за да се најавите:"
"The link works once, for seven days.": "Линкот работи еднаш, седум дена."
"Welcome! Sign in with your new password.": "Добредојдовте! Најавете се со новата лозинка."
"Seeing as someone else": "Гледате како друг корисник"
"You’re seeing this as {name}: nothing can be changed.": "Ова го гледате како {name}: ништо не може да се промени."
"Stop seeing as {name}": "Престанете да гледате како {name}"
"Theme preview": "Преглед на тема"
"You’re previewing the theme “{theme}”: only you see it.": "Ја прегледувате темата „{theme}“: ја гледате само Вие."
"Stop the preview": "Прекинете го прегледот"
"Choose a new password for {site}": "Изберете нова лозинка за {site}"
"Your email address on {site} was changed": "Вашата адреса за е-пошта на {site} е променета"
"{admin} asked you to choose a new password for {site}. Choose it here:": "{admin} побара да изберете нова лозинка за {site}. Изберете ја тука:"
"You were asked to choose a new password for {site}. Choose it here:": "Побарано е да изберете нова лозинка за {site}. Изберете ја тука:"
"The link works once, for a day. Until you use it, your password stays as it is.": "Линкот работи еднаш, еден ден. Додека не го искористите, лозинката останува иста."
"{admin} changed the email address of your account on {site} to {email}. Emails about your account, such as password links, now go there.": "{admin} ја промени адресата за е-пошта на Вашата сметка на {site} во {email}. Пораките за Вашата сметка, како линковите за лозинка, сега одат таму."
"The email address of your account on {site} was changed to {email}. Emails about your account, such as password links, now go there.": "Адресата за е-пошта на Вашата сметка на {site} е променета во {email}. Пораките за Вашата сметка, како линковите за лозинка, сега одат таму."
"If you didn't expect this, contact the people who run the site at once.": "Ако не сте го очекувале ова, веднаш контактирајте ги луѓето што го водат сајтот."
"You no longer see the site as {name}: {reason}": "Веќе не го гледате сајтот како {name}: {reason}"
"A test e-mail from {site}": "Пробна порака од {site}"
"This is the test e-mail you asked for: the site can send e-mails.": "Ова е пробната порака што ја побаравте: сајтот може да испраќа пораки."
"Link to the section “{title}”": "Линк до делот „{title}“"
"Note {number}": "Белешка {number}"
"Table {number}": "Табела {number}"
"Code": "Код"
"Code: {language}": "Код: {language}"
"This image is on {host}, and this site shows only its own images.": "Оваа слика е на {host}, а овој сајт прикажува само свои слики."
"View the image on {host}": "Видете ја сликата на {host}"
"Show password": "Прикажи ја лозинката"
"Show": "Прикажи"
"Done": "Готово"
"Still to come": "Уште следува"
"You’re signed in": "Најавени сте"
"As {name}, on this device.": "Како {name}, на овој уред."
"Go to the homepage": "Кон почетната страница"
"Open the admin": "Отворете ја администрацијата"
"Sign in to {site}": "Најавете се на {site}"
"With the email address or username you registered with.": "Со адресата за е-пошта или корисничкото име со кое се регистриравте."
"Create an account on {site}": "Создајте сметка на {site}"
"{count, plural, one {One field needs fixing:} =2 {Two fields need fixing:} =3 {Three fields need fixing:} other {# fields need fixing:}}": "{count, plural, =1 {Едно поле треба да се поправи:} =2 {Две полиња треба да се поправат:} =3 {Три полиња треба да се поправат:} one {# поле треба да се поправи:} other {# полиња треба да се поправат:}}"
"We’ve sent an email to {email}. Open the link in it to finish creating your account. If this address already has an account, the email tells you how to sign in instead.": "Испративме порака на {email}. Отворете го линкот во неа за да го завршите создавањето на сметката. Ако оваа адреса веќе има сметка, пораката Ви кажува како да се најавите."
"Nothing after 10 minutes?": "Ништо по 10 минути?"
"Send it again": "Испрати ја повторно"
"Wrong address?": "Погрешна адреса?"
"Use a different one": "Употребете друга"
"Welcome, {name}": "Добредојдовте, {name}"
"You’ve been invited to {site} as “{role}”. Choose the password you’ll sign in with as {username}.": "Поканети сте на {site} како „{role}“. Изберете ја лозинката со која ќе се најавувате како {username}."
"You’ve been invited to {site}. Choose the password you’ll sign in with as {username}.": "Поканети сте на {site}. Изберете ја лозинката со која ќе се најавувате како {username}."
"Not expecting this invitation? Leave this page. Nothing happens until you choose a password.": "Не ја очекувавте поканата? Напуштете ја страницата. Ништо не се случува додека не изберете лозинка."
"You’ll sign in with it as {username}.": "Со неа ќе се најавувате како {username}."
"Choose password": "Избери лозинка"
"Get a new confirmation link": "Добијте нов линк за потврда"
"Didn’t get the email to confirm your address, or did its link expire? Enter your email address and we’ll send a new one.": "Не ја добивте пораката за потврда на адресата или нејзиниот линк истече? Внесете ја адресата за е-пошта и ќе Ви испратиме нова."
# Имињата на типовите содржина и улогите на јадрото, нивните реченици и поставките на јадрото
"Post|content type": "Објава"
"Posts|content type": "Објави"
"Page|content type": "Страница"
"Pages|content type": "Страници"
"Everyone|role": "Сите"
"Member|role": "Член"
"Editor|role": "Уредник"
"Admin|role": "Администратор"
"New post": "Нова објава"
"All posts": "Сите објави"
"{count, plural, one {# post} other {# posts}}": "{count, plural, one {# објава} other {# објави}}"
"Search {count, plural, one {# post} other {# posts}}…": "Пребарај {count, plural, one {# објава} other {# објави}}…"
"No posts yet.": "Сè уште нема објави."
"New page": "Нова страница"
"All pages": "Сите страници"
"{count, plural, one {# page} other {# pages}}": "{count, plural, one {# страница} other {# страници}}"
"Search {count, plural, one {# page} other {# pages}}…": "Пребарај {count, plural, one {# страница} other {# страници}}…"
"No pages yet.": "Сè уште нема страници."
"New: {type}": "Ново: {type}"
"All: {types}": "Сите: {types}"
"{types}: {count}": "{types}: {count}"
"Search: {types}…": "Пребарај: {types}…"
"Nothing here yet.": "Тука сè уште нема ништо."
"Site title": "Наслов на сајтот"
"Shown in the browser tab and in the site header.": "Се прикажува во картичката на прелистувачот и во заглавието на сајтот."
"Site description": "Опис на сајтот"
"A short description of the site, used by search engines and when the site is shared.": "Краток опис на сајтот, за пребарувачите и кога сајтот се споделува."
"Share image": "Слика за споделување"
"The image shown when a page without one of its own is shared, e.g. on social networks: a URL, or a path on the site such as \"/images/share.png\". 1200 × 630 pixels works everywhere.": "Сликата што се прикажува кога се споделува страница без своја слика, на пр. на социјални мрежи: URL или патека на сајтот како \"/images/share.png\". 1200 × 630 пиксели одговара насекаде."
"Language": "Јазик"
"The language of the site and of new content, as a language tag such as \"en\", \"de\" or \"pt-BR\".": "Јазикот на сајтот и на новата содржина, како код на јазик, на пр. \"en\", \"de\" или \"pt-BR\"."
"Time zone": "Временска зона"
"Where the site is, e.g. \"Europe/Berlin\": editors enter and see dates and times in it.": "Каде е сајтот, на пр. \"Europe/Berlin\": уредниците внесуваат и гледаат датуми и времиња во неа."
"Approve changes": "Одобрување на промени"
"Whether changes to published content must be approved by a reviewer before they go live. Applies to changes saved as pending revisions, e.g. in the admin.": "Дали промените на објавена содржина мора да ги одобри рецензент пред да одат во живо. Важи за промени зачувани како ревизии во чекање, на пр. во администрацијата."
"Content checks": "Проверки на содржината"
"The level of each check of content before it's published, where it isn't the default: \"error\" (blocks publishing), \"warning\" or \"off\", e.g. {\"core.alt-text\": \"error\"}. List the checks with \"bin/console quire:content:check --list\".": "Нивото на секоја проверка на содржината пред објавување, каде што не е стандардното: \"error\" (го спречува објавувањето), \"warning\" или \"off\", на пр. '{\"core.alt-text\": \"error\"}'. Проверките ги наведува \"bin/console quire:content:check --list\"."
"Revisions to keep": "Ревизии за чување"
"How many revisions to keep per content item. Older ones are deleted. 0 keeps all.": "Колку ревизии се чуваат за секоја ставка. Постарите се бришат. 0 ги чува сите."
"Keep unused files": "Чување неискористени датотеки"
"For how many days the daily clean-up keeps stored files that nothing uses any more (at least 1). Make it at least as long as you keep backups that don't contain the files.": "Колку дена дневното чистење ги чува зачуваните датотеки што веќе ништо не ги користи (најмалку 1). Нека трае барем колку што чувате резервни копии без датотеките."
"Items per page": "Ставки по страница"
"How many items lists such as the blog show per page (1 to 100).": "Колку ставки прикажуваат списоците, како блогот, по страница (од 1 до 100)."
"Homepage": "Почетна страница"
"What the homepage shows: the list of a content type (see \"Homepage list\"), an edition of its newest items with the whole list at its own address (e.g. /blog), a page (see \"Homepage page\"), or a page of an extension (see \"Homepage route\").": "Што прикажува почетната страница: списокот на тип содржина (видете „Список на почетната“), издание на неговите најнови ставки со целиот список на своја адреса (на пр. /blog), страница (видете „Страница на почетната“) или страница на проширување (видете „Рута на почетната“)."
"Homepage list": "Список на почетната"
"The content type whose list, or edition, the homepage shows, e.g. \"post\".": "Типот содржина чиј список или издание го прикажува почетната страница, на пр. \"post\"."
"Homepage page": "Страница на почетната"
"The page the homepage shows: its ID or its path, e.g. \"home\".": "Страницата што ја прикажува почетната: нејзиниот ID или патека, на пр. \"home\"."
"Homepage route": "Рута на почетната"
"The name of the extension route the homepage shows. It must not need parameters.": "Името на рутата на проширување што ја прикажува почетната. Не смее да бара параметри."
"Permission changes": "Промени на дозволите"
"Abilities granted to or revoked from roles, on top of the defaults. Change them with \"bin/console quire:permissions:grant\" and \"revoke\".": "Овластувања доделени или одземени од улоги, над стандардните. Се менуваат со \"bin/console quire:permissions:grant\" и \"revoke\"."
"Site roles": "Улоги на сајтот"
"Roles the site added, by name, with their labels. Change them with \"bin/console quire:permissions:create-role\" and \"delete-role\", or in the admin.": "Улоги што ги додал сајтот, по име, со нивните називи. Се менуваат со \"bin/console quire:permissions:create-role\" и \"delete-role\" или во администрацијата."
"Registration": "Регистрација"
"Whether visitors can create an account on the site, as members. Only while \"Confirm emails\" is on too, so the form never tells who has an account. Emails need a mailer (MAILER_DSN).": "Дали посетителите можат да создадат сметка на сајтот, како членови. Само додека е вклучено и „Потврда на е-пошта“, за формуларот никогаш да не открие кој има сметка. Е-пораките бараат сервер за пошта (MAILER_DSN)."
"Confirm emails": "Потврда на е-пошта"
"Whether people who register confirm their email, by opening an emailed link, before they can sign in. Registration is open only while it's on.": "Дали луѓето што се регистрираат ја потврдуваат е-поштата преку испратен линк пред да можат да се најават. Регистрацијата е отворена само додека ова е вклучено."
"Password reset": "Ресетирање лозинка"
"Whether users who forgot their password can choose a new one through an emailed link.": "Дали корисниците што ја заборавиле лозинката можат да изберат нова преку испратен линк."
"Email sender": "Испраќач на е-пораките"
"Who emails come from, e.g. \"Tournament news <news@example.com>\". Empty for the site title and noreply@ the site's domain.": "Од кого доаѓаат е-пораките, на пр. \"Турнирски вести <news@example.com>\". Празно за насловот на сајтот и noreply@ неговиот домен."
"Keep the audit log": "Чување на дневникот на активности"
"For how many days the audit log keeps who did what. 0 keeps it forever.": "Колку дена дневникот чува кој што направил. 0 го чува засекогаш."
"Password sign-in": "Најава со лозинка"
"Whether users can sign in with a password. Turn it off when everyone signs in another way, e.g. with single sign-on.": "Дали корисниците можат да се најавуваат со лозинка. Исклучете кога сите се најавуваат на друг начин, на пр. со единствена најава (SSO)."
"Theme": "Тема"
"The ID of the site's theme, e.g. \"acme-dark\". Empty for Quire's built-in templates.": "ID-то на темата на сајтот, на пр. \"acme-dark\". Празно за вградените шаблони на Quire."
"This site is called {value}.": "Овој сајт се вика {value}."
"It's described as {value}.": "Опишан е како {value}."
"When a page without an image of its own is shared, it shows {value}.": "Кога се споделува страница без своја слика, се прикажува {value}."
"It's written in {value}.": "Напишан е на {value}."
"It's in the {value} time zone.": "Во временската зона {value} е."
"Changes to live content {value} before they go live.": "Промените на содржината во живо {value} пред да одат во живо."
"need a reviewer's approval": "бараат одобрување од рецензент"
"don't need anyone's approval": "не бараат ничие одобрување"
"Checks of content before it's published: {value}.": "Проверки на содржината пред објавување: {value}."
"Each item keeps its last {value} versions.": "Секоја ставка ги чува своите последни {value} верзии."
"Stored files nothing uses any more are kept for {value} days.": "Зачуваните датотеки што ништо не ги користи се чуваат {value} дена."
"Lists show {value} items at a time.": "Списоците прикажуваат по {value} ставки."
"Its homepage shows {value}.": "Почетната страница прикажува {value}."
"a list of content": "список на содржина"
"an edition of the newest content": "издание на најновата содржина"
"a page": "страница"
"a page of an extension": "страница на проширување"
"The homepage's list is of {value}.": "Списокот на почетната е од {value}."
"The homepage's page is {value}.": "Страницата на почетната е {value}."
