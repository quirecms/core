"Welcome! Sign in with your new password.": "Willkommen! Melden Sie sich mit Ihrem neuen Passwort an."
"Seeing as someone else": "Ansicht als jemand anderes"
"You’re seeing this as {name}: nothing can be changed.": "Du siehst das als {name}: Nichts kann geändert werden."
"Stop seeing as {name}": "Nicht mehr als {name} ansehen"
"Theme preview": "Theme-Vorschau"
"You’re previewing the theme “{theme}”: only you see it.": "Du siehst das Theme „{theme}“ in der Vorschau: Nur du siehst es."
"Stop the preview": "Vorschau beenden"
"Choose a new password for {site}": "Wähle ein neues Passwort für {site}"
"Your email address on {site} was changed": "Deine E-Mail-Adresse bei {site} wurde geändert"
"{admin} asked you to choose a new password for {site}. Choose it here:": "{admin} bittet dich, ein neues Passwort für {site} zu wählen. Wähle es hier:"
"You were asked to choose a new password for {site}. Choose it here:": "Du wurdest gebeten, ein neues Passwort für {site} zu wählen. Wähle es hier:"
