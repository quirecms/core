"Stored files nothing uses any more are kept for {value} days.": "Gespeicherte Dateien, die nichts mehr verwendet, werden {value} Tage behalten."
"Lists show {value} items at a time.": "Listen zeigen {value} Einträge auf einmal."
"Its homepage shows {value}.": "Ihre Startseite zeigt {value}."
