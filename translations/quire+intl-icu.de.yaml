# Namen der Inhaltstypen und Rollen von Core, ihre Sätze und die Einstellungen von Core
"Post|content type": "Beitrag"
"Posts|content type": "Beiträge"
"Page|content type": "Seite"
"Pages|content type": "Seiten"
"Everyone|role": "Alle"
"Member|role": "Mitglied"
"Editor|role": "Redakteur"
"Admin|role": "Admin"
"New post": "Neuer Beitrag"
"All posts": "Alle Beiträge"
"{count, plural, one {# post} other {# posts}}": "{count, plural, one {# Beitrag} other {# Beiträge}}"
"Search {count, plural, one {# post} other {# posts}}…": "{count, plural, one {# Beitrag} other {# Beiträge}} durchsuchen…"
"No posts yet.": "Noch keine Beiträge."
"New page": "Neue Seite"
"All pages": "Alle Seiten"
"{count, plural, one {# page} other {# pages}}": "{count, plural, one {# Seite} other {# Seiten}}"
"Search {count, plural, one {# page} other {# pages}}…": "{count, plural, one {# Seite} other {# Seiten}} durchsuchen…"
"No pages yet.": "Noch keine Seiten."
"New: {type}": "Neu: {type}"
"All: {types}": "Alle: {types}"
"{types}: {count}": "{types}: {count}"
"Search: {types}…": "Durchsuchen: {types}…"
"Nothing here yet.": "Hier ist noch nichts."
"Site title": "Titel der Website"
"Shown in the browser tab and in the site header.": "Erscheint im Browser-Tab und im Kopf der Website."
"Site description": "Beschreibung der Website"
"A short description of the site, used by search engines and when the site is shared.": "Eine kurze Beschreibung der Website, für Suchmaschinen und beim Teilen."
"Share image": "Bild zum Teilen"
"The image shown when a page without one of its own is shared, e.g. on social networks: a URL, or a path on the site such as \"/images/share.png\". 1200 × 630 pixels works everywhere.": "Das Bild, das erscheint, wenn eine Seite ohne eigenes Bild geteilt wird, z. B. in sozialen Netzwerken: eine URL oder ein Pfad auf der Website wie \"/images/share.png\". 1200 × 630 Pixel passen überall."
"Language": "Sprache"
"The language of the site and of new content, as a language tag such as \"en\", \"de\" or \"pt-BR\".": "Die Sprache der Website und neuer Inhalte, als Sprachcode wie \"en\", \"de\" oder \"pt-BR\"."
"Time zone": "Zeitzone"
"Where the site is, e.g. \"Europe/Berlin\": editors enter and see dates and times in it.": "Wo die Website ist, z. B. \"Europe/Berlin\": Redakteure geben Datum und Uhrzeit darin ein und sehen sie darin."
"Approve changes": "Änderungen freigeben"
"Whether changes to published content must be approved by a reviewer before they go live. Applies to changes saved as pending revisions, e.g. in the admin.": "Ob Änderungen an veröffentlichten Inhalten von einer prüfenden Person freigegeben werden müssen, bevor sie live gehen. Gilt für Änderungen, die als ausstehende Revisionen gespeichert werden, z. B. im Admin."
"Content checks": "Inhaltsprüfungen"
"The level of each check of content before it's published, where it isn't the default: \"error\" (blocks publishing), \"warning\" or \"off\", e.g. {\"core.alt-text\": \"error\"}. List the checks with \"bin/console quire:content:check --list\".": "Die Stufe jeder Prüfung von Inhalten vor der Veröffentlichung, wo sie nicht die Standardstufe ist: \"error\" (blockiert die Veröffentlichung), \"warning\" oder \"off\", z. B. '{\"core.alt-text\": \"error\"}'. Die Prüfungen listet \"bin/console quire:content:check --list\"."
"Revisions to keep": "Aufbewahrte Revisionen"
"How many revisions to keep per content item. Older ones are deleted. 0 keeps all.": "Wie viele Revisionen je Inhalt aufbewahrt werden. Ältere werden gelöscht. 0 behält alle."
"Keep unused files": "Ungenutzte Dateien behalten"
"For how many days the daily clean-up keeps stored files that nothing uses any more (at least 1). Make it at least as long as you keep backups that don't contain the files.": "Wie viele Tage die tägliche Bereinigung gespeicherte Dateien behält, die nichts mehr verwendet (mindestens 1). Mindestens so lange wie Backups, die die Dateien nicht enthalten."
"Items per page": "Einträge pro Seite"
"How many items lists such as the blog show per page (1 to 100).": "Wie viele Einträge Listen wie der Blog pro Seite zeigen (1 bis 100)."
"Homepage": "Startseite"
"What the homepage shows: the list of a content type (see \"Homepage list\"), an edition of its newest items with the whole list at its own address (e.g. /blog), a page (see \"Homepage page\"), or a page of an extension (see \"Homepage route\").": "Was die Startseite zeigt: die Liste eines Inhaltstyps (siehe \"Liste der Startseite\"), eine Ausgabe seiner neuesten Einträge mit der ganzen Liste unter eigener Adresse (z. B. /blog), eine Seite (siehe \"Seite der Startseite\") oder eine Seite einer Erweiterung (siehe \"Route der Startseite\")."
"Homepage list": "Liste der Startseite"
"The content type whose list, or edition, the homepage shows, e.g. \"post\".": "Der Inhaltstyp, dessen Liste oder Ausgabe die Startseite zeigt, z. B. \"post\"."
"Homepage page": "Seite der Startseite"
"The page the homepage shows: its ID or its path, e.g. \"home\".": "Die Seite, die die Startseite zeigt: ihre ID oder ihr Pfad, z. B. \"home\"."
"Homepage route": "Route der Startseite"
"The name of the extension route the homepage shows. It must not need parameters.": "Der Name der Erweiterungsroute, die die Startseite zeigt. Sie darf keine Parameter brauchen."
"Permission changes": "Geänderte Berechtigungen"
"Abilities granted to or revoked from roles, on top of the defaults. Change them with \"bin/console quire:permissions:grant\" and \"revoke\".": "Fähigkeiten, die Rollen über die Standards hinaus gegeben oder genommen wurden. Ändern mit \"bin/console quire:permissions:grant\" und \"revoke\"."
"Site roles": "Rollen der Website"
"Roles the site added, by name, with their labels. Change them with \"bin/console quire:permissions:create-role\" and \"delete-role\", or in the admin.": "Rollen, die die Website hinzugefügt hat, nach Namen, mit ihren Bezeichnungen. Ändern mit \"bin/console quire:permissions:create-role\" und \"delete-role\" oder im Admin."
"Registration": "Registrierung"
"Whether visitors can create an account on the site, as members. Only while \"Confirm emails\" is on too, so the form never tells who has an account. Emails need a mailer (MAILER_DSN).": "Ob Besucher auf der Website ein Konto als Mitglied anlegen können. Nur solange auch \"E-Mails bestätigen\" an ist, damit das Formular nie verrät, wer ein Konto hat. E-Mails brauchen einen Mailer (MAILER_DSN)."
"Confirm emails": "E-Mails bestätigen"
"Whether people who register confirm their email, by opening an emailed link, before they can sign in. Registration is open only while it's on.": "Ob Personen, die sich registrieren, ihre E-Mail-Adresse über einen zugesandten Link bestätigen, bevor sie sich anmelden können. Die Registrierung ist nur offen, solange dies an ist."
"Password reset": "Passwort zurücksetzen"
"Whether users who forgot their password can choose a new one through an emailed link.": "Ob Benutzer, die ihr Passwort vergessen haben, über einen zugesandten Link ein neues wählen können."
"Email sender": "Absender der E-Mails"
"Who emails come from, e.g. \"Tournament news <news@example.com>\". Empty for the site title and noreply@ the site's domain.": "Von wem E-Mails kommen, z. B. \"Turniernachrichten <news@example.com>\". Leer für den Titel der Website und noreply@ ihrer Domain."
"Keep the audit log": "Protokoll aufbewahren"
"For how many days the audit log keeps who did what. 0 keeps it forever.": "Wie viele Tage das Protokoll aufbewahrt, wer was getan hat. 0 behält es für immer."
"Password sign-in": "Anmeldung mit Passwort"
"Whether users can sign in with a password. Turn it off when everyone signs in another way, e.g. with single sign-on.": "Ob Benutzer sich mit einem Passwort anmelden können. Ausschalten, wenn sich alle anders anmelden, z. B. mit Single Sign-on."
"Theme": "Theme"
"The ID of the site's theme, e.g. \"acme-dark\". Empty for Quire's built-in templates.": "Die ID des Themes der Website, z. B. \"acme-dark\". Leer für die eingebauten Vorlagen von Quire."
"This site is called {value}.": "Diese Website heißt {value}."
